# Deploy nach GitHub Pages bei jedem Push auf main (Issue #10, A-T2).
# Baut dist/ (inkl. Kopie von daten/ durch scripts/build-abschluss.mjs) und veroeffentlicht
# es ueber die Pages-Quelle "GitHub Actions" unter https://herr-cbert.github.io/astobsim/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deploy gleichzeitig; ein laufender Deploy wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    name: Bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  veroeffentlichen:
    name: Veroeffentlichen
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
